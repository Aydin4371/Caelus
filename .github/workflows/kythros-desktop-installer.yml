name: Kythros Full 3D installer

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "solver/pelec-rdre/**"
      - "src-tauri/**"
      - "desktop/**"
      - "vite.desktop.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/kythros-desktop-installer.yml"
  pull_request:
    branches:
      - main
    paths:
      - "solver/pelec-rdre/**"
      - "src-tauri/**"
      - "desktop/**"
      - "lib/local-cfd.ts"
      - "lib/desktop-cfd-client.ts"
      - "components/rde-2d-workspace.tsx"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/kythros-desktop-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kythros-installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  solver-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out Kythros
        uses: actions/checkout@v4

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran cmake ninja-build pkg-config

      - name: Validate the solver request boundary
        run: |
          chmod +x solver/pelec-rdre/scripts/*.sh
          solver/pelec-rdre/scripts/validate-source.sh

      - name: Restore the pinned solver build
        id: solver-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kythros-solver/output
          key: kythros-pelec-cpu-${{ hashFiles('solver/pelec-rdre/Exec/KythrosRDRE/GNUmakefile', 'solver/pelec-rdre/Exec/KythrosRDRE/Make.package', 'solver/pelec-rdre/Exec/KythrosRDRE/prob.H', 'solver/pelec-rdre/Exec/KythrosRDRE/prob.cpp', 'solver/pelec-rdre/Exec/KythrosRDRE/prob_parm.H', 'solver/pelec-rdre/scripts/build-solver.sh', 'solver/pelec-rdre/upstream-lock.json') }}

      - name: Build pinned PeleC RDRE executable
        if: steps.solver-cache.outputs.cache-hit != 'true'
        run: solver/pelec-rdre/scripts/build-solver.sh cpu "${RUNNER_TEMP}/kythros-solver"

      - name: Execute three-dimensional annulus smoke case
        run: solver/pelec-rdre/scripts/test-smoke.sh "${RUNNER_TEMP}/kythros-solver/output/kythros-pelec-rdre.bin" "${RUNNER_TEMP}/kythros-smoke"

      - name: Assemble solver runtime
        run: solver/pelec-rdre/scripts/package-runtime.sh "${RUNNER_TEMP}/kythros-solver/output/kythros-pelec-rdre.bin" "${RUNNER_TEMP}/kythros-solver/output/accelerator.txt" "${RUNNER_TEMP}/runtime-stage" "${RUNNER_TEMP}/kythros-runtime.tar.gz"

      - name: Build the isolated WSL2 runtime image
        run: solver/pelec-rdre/scripts/build-rootfs.sh "${RUNNER_TEMP}/kythros-runtime.tar.gz" "${RUNNER_TEMP}/rootfs-build" "${RUNNER_TEMP}/kythros-solver-rootfs.tar"

      - name: Upload solver image
        uses: actions/upload-artifact@v4
        with:
          name: kythros-solver-rootfs
          path: ${{ runner.temp }}/kythros-solver-rootfs.tar
          retention-days: 7
          compression-level: 1

  windows-installer:
    needs: solver-runtime
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out Kythros
        uses: actions/checkout@v4

      - name: Download packaged Full 3D runtime
        uses: actions/download-artifact@v4
        with:
          name: kythros-solver-rootfs
          path: src-tauri/resources

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Use stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install exact dependencies
        run: npm ci

      - name: Build the combined Windows installer
        run: npm run desktop:build

      - name: Upload installable application
        uses: actions/upload-artifact@v4
        with:
          name: Kythros-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: windows-installer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: desktop-build-${{ github.run_number }}
    steps:
      - name: Download tested Windows installer
        uses: actions/download-artifact@v4
        with:
          name: Kythros-Windows-Installer
          path: installer

      - name: Prepare stable download name and checksum
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' installers < <(find installer -type f -name '*.exe' -print0)
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "Expected exactly one Windows installer."
            exit 1
          fi
          cp "${installers[0]}" Kythros-Setup.exe
          sha256sum Kythros-Setup.exe > SHA256SUMS.txt
          cat > release-notes.md <<'NOTES'
          Download Kythros-Setup.exe below, run it, then open Kythros and choose Full 3D → Install Full 3D runtime. Windows may require a restart to enable WSL2.

          Windows 10/11 x64. Includes the CPU/OpenMP Full 3D solver; CUDA acceleration is not included. This is a development solver, not a validated engineering prediction release. The build executes a one-step 3D annulus smoke test, not a complete RDE validation campaign. The installer is not code-signed.

          Release assets do not have the workflow artifacts' automatic expiry. This repository is private, so downloading requires a GitHub account with repository access. SHA256SUMS.txt can be used to verify download integrity.
          NOTES
          printf '\nSource commit: %s\n' "$GITHUB_SHA" >> release-notes.md

      - name: Upload all assets before publishing the release
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" --title "Kythros Windows build ${GITHUB_RUN_NUMBER}" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" Kythros-Setup.exe SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest --notes-file release-notes.md
