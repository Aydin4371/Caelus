name: Kythros Full 3D installer

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "solver/pelec-rdre/**"
      - "src-tauri/**"
      - "desktop/**"
      - "vite.desktop.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/kythros-desktop-installer.yml"
  pull_request:
    branches:
      - main
    paths:
      - "solver/pelec-rdre/**"
      - "src-tauri/**"
      - "desktop/**"
      - "lib/local-cfd.ts"
      - "lib/desktop-cfd-client.ts"
      - "components/rde-2d-workspace.tsx"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/kythros-desktop-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kythros-installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  solver-runtime:
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Identify Windows toolchain image
        id: image
        run: '"version=$env:ImageVersion" >> $env:GITHUB_OUTPUT'
      - name: Restore native build
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/kythros-native
          key: native-clang-v1-${{ steps.image.outputs.version }}-${{ hashFiles('solver/pelec-rdre/upstream-lock.json') }}-${{ hashFiles('solver/pelec-rdre/scripts/build-windows.ps1', 'solver/pelec-rdre/Exec/KythrosRDRE/**') }}
          restore-keys: |
            native-clang-v1-${{ steps.image.outputs.version }}-${{ hashFiles('solver/pelec-rdre/upstream-lock.json') }}-
      - name: Build native Windows solver
        run: ./solver/pelec-rdre/scripts/build-windows.ps1 -WorkDirectory "$env:RUNNER_TEMP/kythros-native"
      - name: Package native solver and result reader
        run: ./solver/pelec-rdre/scripts/package-windows.ps1 -SolverDirectory "$env:RUNNER_TEMP/kythros-native/output" -Destination "$env:RUNNER_TEMP/native-runtime" -WorkDirectory "$env:RUNNER_TEMP/runtime-package-build"
      - name: Test packaged request-to-result workflow
        run: |
          $env:OMP_NUM_THREADS = '2'
          & "$env:RUNNER_TEMP/native-runtime/kythros-runtime.exe" --self-test "$env:RUNNER_TEMP/packaged CFD test"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged solver test failed.' }
      - name: Upload native runtime
        uses: actions/upload-artifact@v4
        with:
          name: kythros-native-runtime
          path: ${{ runner.temp }}/native-runtime/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-runtime-diagnostics
          path: |
            ${{ runner.temp }}/packaged CFD test/
            ${{ runner.temp }}/runtime-package-build/build/kythros-runtime/warn-kythros-runtime.txt
      - name: Preserve compiled dependencies
        if: ${{ !cancelled() && steps.build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/kythros-native
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

  windows-installer:
    needs: solver-runtime
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out Kythros
        uses: actions/checkout@v4

      - name: Download packaged Full 3D runtime
        uses: actions/download-artifact@v4
        with:
          name: kythros-native-runtime
          path: src-tauri/resources/native-runtime

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Use stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install exact dependencies
        run: npm ci

      - name: Build the combined Windows installer
        run: npm run desktop:build

      - name: Test the installed native application
        shell: pwsh
        run: ./solver/pelec-rdre/scripts/test-windows-installer.ps1

      - name: Preserve installed-app diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-native-diagnostics
          path: ${{ runner.temp }}/Kythros installed CFD test/

      - name: Upload installable application
        uses: actions/upload-artifact@v4
        with:
          name: Kythros-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: windows-installer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: desktop-build-${{ github.run_number }}
    steps:
      - name: Download tested Windows installer
        uses: actions/download-artifact@v4
        with:
          name: Kythros-Windows-Installer
          path: installer

      - name: Prepare stable download name and checksum
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' installers < <(find installer -type f -name '*.exe' -print0)
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "Expected exactly one Windows installer."
            exit 1
          fi
          cp "${installers[0]}" Kythros-Setup.exe
          sha256sum Kythros-Setup.exe > SHA256SUMS.txt
          cat > release-notes.md <<'NOTES'
          Download Kythros-Setup.exe below, run it, then open Kythros and choose Full 3D → Run Full 3D. The native Windows solver and result reader are included. No WSL, Linux distribution, or separate Python installation is needed.

          Windows 10/11 x64. Includes the CPU/OpenMP Full 3D solver; CUDA acceleration is not included. This is a development solver, not a validated engineering prediction release. The installed app passes a native request-to-result smoke test. This is not a complete RDE validation campaign; the existing smoke case has a known temperature anomaly also present on Linux. The installer is not code-signed.

          Release assets do not have the workflow artifacts' automatic expiry. This repository is private, so downloading requires a GitHub account with repository access. SHA256SUMS.txt can be used to verify download integrity.
          NOTES
          printf '\nSource commit: %s\n' "$GITHUB_SHA" >> release-notes.md

      - name: Upload all assets before publishing the release
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" --title "Kythros Windows build ${GITHUB_RUN_NUMBER}" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" Kythros-Setup.exe SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest --notes-file release-notes.md

