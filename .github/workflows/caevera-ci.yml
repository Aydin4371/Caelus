name: Caevera verification

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caevera-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out proposed source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Normalize repository script permissions
        run: chmod +x scripts/*.sh

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Numerical, build, and rendered-page tests
        run: npm test

      - name: Validate production artifact
        run: npm run validate:artifact
